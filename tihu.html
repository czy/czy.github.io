<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#141c33" />
    <title>鹈鹕骑车 · Pelican on a Bicycle</title>
    <meta
      name="description"
      content="Three.js 制作的 3D 动画：一只鹈鹕沿着海边公路骑车。"
    />
    <script type="module" crossorigin src="/assets/index-DFd5h9q8.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-R6tjcntu.css">
  </head>
  <body>
    <canvas id="stage"></canvas>

    <div id="vignette" aria-hidden="true"></div>

    <header id="title-card">
      <p class="eyebrow">Three.js · 实时 3D 动画</p>
      <h1>鹈鹕骑车</h1>
      <p class="subtitle">Pelican on a Bicycle</p>
    </header>

    <div id="hud">
      <div class="gauge">
        <span id="speed-value">0</span>
        <span class="unit">km/h</span>
      </div>
      <div class="gauge-meta"><span id="gear-label">巡航</span> · <span id="cadence-value">0</span> rpm</div>
    </div>

    <footer id="hints">
      <span><kbd>拖动</kbd>旋转视角</span>
      <span><kbd>滚轮</kbd>缩放</span>
      <span><kbd>空格</kbd>冲刺</span>
      <span><kbd>Shift</kbd>刹车</span>
      <span><kbd>C</kbd>切换机位</span>
      <span><kbd>B</kbd>按铃</span>
      <span><kbd>H</kbd>隐藏界面</span>
    </footer>

    <div id="loader">
      <div class="loader-inner">
        <div class="wing"></div>
        <p>正在召集鹈鹕…</p>
      </div>
    </div>

    <noscript>这个页面需要启用 JavaScript 才能运行。</noscript>
  </body>
</html>
